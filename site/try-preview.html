<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sol · Your turn (preview)</title>
<!-- try.js on its own: a screen of night ground above and below, so the section scrolls into view and starts the way it
     does on the home page. The section's words are a copy of index.html's #try; edit them there. The chapter rules are a
     copy of index.html's .chapter rules, so the heading sits as it does on the page. -->
<link rel="icon" href="media/jelly-mark.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="try.css">
<style>
  .filler { min-height:100vh; display:grid; place-items:center; text-align:center; padding:0 6%; color:var(--mute); }
  .filler h2 { margin:0; color:var(--ink); font-size:clamp(28px,4vw,48px); letter-spacing:-.04em; font-weight:600; }
  .filler p { margin:12px 0 0; }
  .chapter { padding:150px 0 130px; text-align:center; position:relative; }
  .chapter h2 { margin:0; font-size:clamp(40px,5.6vw,84px); letter-spacing:-.05em; font-weight:650; line-height:.98; }
  .chapter h2 span { background:var(--acc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .chapter > p { color:var(--dim); font-size:18px; max-width:560px; margin:18px auto 56px; line-height:1.5; padding:0 24px; }
  @media (max-width:900px) { .chapter { padding:100px 0 80px; } .chapter > p { font-size:16px; } }
</style>
</head>
<body>
<section class="filler"><div><h2>See it</h2><p>(the section before)</p><p>scroll down</p></div></section>

<section id="try" class="chapter">
  <h2>Your turn.<br><span>Type anything.</span></h2>
  <p>This is Sol's window, built from the app's own parts. It plays on its own until you take over.</p>
  <div id="try-window"></div>
</section>

<section class="filler"><div><h2>Bring your people</h2><p>(the section after)</p></div></section>
<script src="jelly.js"></script>
<script type="module">import './try.js'; SolTry.mount(document.getElementById('try-window'));</script>
</body>
</html>
