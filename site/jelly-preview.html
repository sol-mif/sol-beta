<!doctype html><meta charset="utf-8"><title>the jelly · preview</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding:40px; } .row { display:flex; gap:56px; align-items:center; flex-wrap:wrap; margin:0 0 56px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:22px; color:var(--mute); font-size:12px; }
  #field { position:relative; width:600px; height:240px; border:1px solid var(--hair); border-radius:18px; }
</style>
<div class="row">
  <div class="cell"><span id="a"></span>mark 22</div>
  <div class="cell"><span id="b"></span>48 · hover</div>
  <div class="cell"><span id="c"></span>120 · birth</div>
  <div class="cell"><span id="d"></span>120 · apart · follow</div>
</div>
<div class="row" style="gap:120px;padding:40px 60px">
  <div class="cell"><span id="e"></span><br>breath</div>
  <div class="cell"><span id="f"></span><br>close</div>
  <div class="cell"><span id="g"></span><br>pool</div>
</div>
<div id="field"></div>
<script src="jelly.js"></script>
<script>
  const $ = s => document.querySelector(s);
  SolJelly.mount($('#a'), { size:22 });
  SolJelly.mount($('#b'), { size:48, hover:true });
  SolJelly.mount($('#c'), { size:120, birth:true });
  SolJelly.mount($('#d'), { size:120, state:'apart', follow:true });
  SolJelly.mount($('#e'), { size:120, halo:'breath' });
  SolJelly.mount($('#f'), { size:120, halo:'close' });
  SolJelly.mount($('#g'), { size:120, halo:'pool' });
  const D = SolJelly.dots($('#field'), { dot:16 });
  (function loop(now) { const t = now / 1000, k = .5 + .5 * Math.sin(t * .8);
    D.put([0,1,2,3,4,5].map(i => [300 + Math.cos(i / 6 * 6.28 + t * .3) * (30 + 220 * k), 120 + Math.sin(i / 6 * 6.28 + t * .3) * (14 + 80 * k)]));
    requestAnimationFrame(loop); })(0);
</script>
